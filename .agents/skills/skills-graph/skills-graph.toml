# skills-graph.toml: the curated half of the skills graph (the other half is parsed from SKILL.md files).
# Edited by hand, or by `skills_graph.py approve N` after the owner accepted a proposal. Never by an agent on its own.
# Node ids: installed skills by their frontmatter name; catalog rows by the slug of their first table cell,
# unless a [[node]] below claims the row's URL under a shorter id. Edge types: calls (parsed only), precedes,
# feeds, alternative-to, candidate-for, guided-by. An endpoint that is not reachable on this machine shows up
# in the "missing" ring, which is the gap list scout works from.

[remote]
# Canonical lists for the remote ring (docs/catalog/community-skills.md and mcp-servers.md were built from them).
# Fetched only by `/skills-graph refresh-remote` after the owner said yes; the snapshot lands in remote.json with a date.
sources = [
  "https://github.com/VoltAgent/awesome-agent-skills",
  "https://github.com/travisvn/awesome-claude-skills",
  "https://github.com/BehiSecc/awesome-claude-skills",
  "https://github.com/ComposioHQ/awesome-claude-skills",
  "https://github.com/O0000-code/awesome-academic-skills",
  "https://github.com/punkpeye/awesome-mcp-servers",
  "https://skills.sh",
  "https://agentskills.io",
]

# ---- Design stack (frontend) -------------------------------------------------------------------------------

[[node]]
id = "impeccable"
ring = "catalog"
url = "https://github.com/pbakaus/impeccable"
description = "Design-language harness: 23 commands (craft, shape, critique, audit, polish, typeset, colorize, layout, animate, ...) plus DESIGN.md/PRODUCT.md; deterministic, no key, no network at use time. Apache-2.0."
install = "/plugin marketplace add pbakaus/impeccable  (or copy dist/claude-code/.claude into the project)"
gate = "plugin marketplace add is a network fetch: AGENTS.md HITL list"

[[node]]
id = "magic-mcp"
ring = "catalog"
url = "https://github.com/21st-dev/magic-mcp"
description = "21st MCP: search 10,000+ React/Tailwind components, get_component, get_inspiration, search_logo; generate/iterate only on the paid AI plan. Needs API_KEY_21ST (free Builder plan). ISC."
install = "claude mcp add --transport http 21st https://21st.dev/api/mcp  (header x-api-key)"
gate = "hosted MCP with a key: AGENTS.md HITL list; every call is a network call"

[[edge]]
from = "impeccable"
type = "precedes"
to = "magic-mcp"
why = "art direction and visual guardrails come first; components are picked against them"

[[edge]]
from = "magic-mcp"
type = "guided-by"
to = "impeccable"
why = "every component magic-mcp returns is filtered by the DESIGN.md impeccable produced"

[[edge]]
from = "magic-mcp"
type = "feeds"
to = "ponytail-review"
why = "the composed page goes to the ponytail ruleset for implementation size and review"

[[edge]]
from = "frontend-design"
type = "alternative-to"
to = "impeccable"
why = "the official frontend-design plugin covers the same job with one skill and no DESIGN.md"

