# GitHub Pages serves site/public, the public edition the build writes. No build step runs here: the page is committed
# already built, so the deploy is a copy and every number on it was measured on the reference machine.
name: pages
on:
  push:
    branches: [master]
    paths: ["site/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
